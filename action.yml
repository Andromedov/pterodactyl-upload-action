name: "Upload files to Pterodactyl"
description: "This GitHub Action allows you to upload files to multiple Pterodactyl servers with just one action, featuring socket support."
inputs:
  panel-host: # id of input
    description: "The host of the pterodactyl instance"
    required: true
  api-key:
    description: "The client api key of the pterodactyl instance"
    required: true
  server-id:
    description: "The server id of the server"
    required: false
  server-ids:
    description: "The server ids of the servers"
    required: false
  source:
    description: "The source to upload"
    required: false
  sources:
    description: "The sources to upload"
    required: false
  target:
    description: "The target where the files should be uploaded on the servers"
    required: false
  restart:
    description: "Restart the servers after the upload"
    required: false
    default: false
  command:
    description: "Console command to run after upload"
    required: false
  proxy:
    description: "The proxy to use"
    required: false
  decompress-target:
    description: "Decompress archive file after upload in target"
    required: false
    default: false
  delete-files-in-dir:
    description: "Delete all files in target folder"
    required: false
    default: false
  files-type:
    description: "Type of file filtering: 'whitelist' (keep only specified files) or 'blacklist' (delete only specified files)"
    required: false
    default: "blacklist"
  files-list:
    description: "Comma-separated file or directory patterns; ./data/ matches only target/data, data/ and */data/ match data directories at any depth"
    required: false
    default: ""
  delete-batch-size:
    description: "Maximum entries per cleanup DELETE request; 0 keeps one batch per directory. Failed deletes are never retried."
    required: false
    default: "0"
  cleanup-dry-run:
    description: "Validate sources and print the cleanup plan using listing requests only; stop without deletion, upload, decompression, commands or restart. Requires directory cleanup."
    required: false
    default: "false"
  follow-symbolic-links:
    description: "Follow local source symbolic links during globbing; remote cleanup never follows symbolic links"
    default: true
runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "server"
  color: "blue"
